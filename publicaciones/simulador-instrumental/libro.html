/* ══════════════════════════════════════════════════════════════════
   El texto del banco, compuesto como un libro
   ──────────────────────────────────────────────────────────────────
   Prueba de maqueta. El texto es el mismo de la página del simulador.
   Tres cosas la definen: papel blanco, composición al modo de LaTeX
   (Computer Modern, texto justificado con partición de palabras y
   sangría de primera línea), y una vuelta de hoja que arquea el papel
   en vez de girar un rectángulo rígido.
   ══════════════════════════════════════════════════════════════════ */
.envoltorio{max-width:var(--maxw);margin:0 auto;padding:26px 22px 60px}
.cabecera{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.cabecera h1{font-size:26px;margin:0;letter-spacing:-.3px}
.cabecera .aviso{font-size:12.5px;color:var(--soft)}

/* ---- el mueble ----
   El libro apoyado: la tapa oscura asoma apenas por los cuatro lados y
   el lomo hunde el centro. Todo lo demás es papel. */
.libro{
  position:relative;width:100%;height:clamp(440px,70vh,800px);
  perspective:2800px;perspective-origin:50% 40%;
  margin:0 auto;user-select:none;
}
.tapa{
  position:absolute;inset:-9px -11px;border-radius:8px;
  background:linear-gradient(180deg,#2a2018,#1b1510);
  box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
}
.lomo{
  position:absolute;top:0;bottom:0;left:50%;width:52px;margin-left:-26px;
  background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(60,42,26,.30) 34%,
             rgba(35,24,14,.55) 50%,rgba(60,42,26,.30) 66%,rgba(0,0,0,0) 100%);
  z-index:400;pointer-events:none;
}
.hojas{position:absolute;inset:0;transform-style:preserve-3d}

/* ---- las hojas quietas ----
   Mientras nadie pasa una página son dos caras planas. La hoja que se
   está dando vuelta se arma aparte, en tiras, y se descarta al terminar:
   tener todas las hojas en tiras sería copiar el texto doscientas veces. */
.hoja{
  position:absolute;top:0;bottom:0;left:50%;width:50%;
  transform-origin:left center;transform-style:preserve-3d;
}
.hoja.vuelta{transform:rotateY(-180deg)}
.cara{
  position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
  background:
    radial-gradient(120% 90% at 0% 50%, rgba(0,0,0,.055) 0%, rgba(0,0,0,0) 38%),
    linear-gradient(#fdfcf8,#f7f4ec);
}
.cara.frente{box-shadow:inset 15px 0 26px -18px rgba(70,52,30,.75)}
.cara.dorso{transform:rotateY(180deg);box-shadow:inset -15px 0 26px -18px rgba(70,52,30,.75)}

/* ---- la caja de texto, al modo de LaTeX ---- */
.hueco{
  position:absolute;inset:0;padding:44px 52px 46px;overflow:hidden;
  font-family:"Computer Modern Serif","Latin Modern Roman",Georgia,"Times New Roman",serif;
  font-size:16.5px;line-height:1.46;color:#14161a;
  text-align:justify;hyphens:auto;-webkit-hyphens:auto;
  /* este Computer Modern de la red trae mal los glifos de ligadura: "fila"
     salía dibujada como "4la". Sin ligaduras, las letras salen bien. */
  font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0,"dlig" 0;
}
.hueco > *:first-child{margin-top:0}
.hueco p{margin:0;text-indent:1.5em}
/* en composición clásica, el primer párrafo de una sección no lleva sangría */
.hueco h2 + p, .hueco h3 + p, .hueco .titulo + p, .hueco .form + p{text-indent:0}
.hueco p.sigue{text-indent:0}   /* viene de la página anterior */
.hueco h3{
  font-size:17.5px;font-weight:700;margin:1.15em 0 .35em;
  text-indent:0;text-align:left;color:#0c0e12;line-height:1.25;
}
.hueco h3 .num{margin-right:.5em}
.hueco b{font-weight:700;color:#000}
.hueco ul{list-style:none;padding-left:1.6em;margin:.55em 0}
.hueco li{margin:.28em 0;position:relative;text-indent:0}
.hueco li::before{content:"•";position:absolute;left:-1em;color:#444}
/* las fórmulas, centradas y sin recuadro, como una ecuación desplegada */
.hueco .form{
  display:block;text-align:center;text-indent:0;margin:.95em 0;
  font-size:1.04em;line-height:1.4;
}
.hueco .form span{
  display:block;font-size:.8em;font-style:italic;color:#4a4f57;margin-top:.3em;
}
/* la portada del texto, con su filete */
.hueco .titulo{text-align:center;text-indent:0;margin:0 0 1.6em}
.hueco .titulo h2{font-size:25px;font-weight:700;margin:.2em 0 .35em;color:#000;letter-spacing:0}
.hueco .titulo .filete{width:120px;height:1px;background:#2a2e35;margin:.7em auto}
.hueco .titulo p{font-size:13.5px;font-style:italic;color:#4a4f57;text-indent:0;margin:0}

.folio{
  position:absolute;left:0;right:0;bottom:16px;text-align:center;
  font-family:"Computer Modern Serif",Georgia,serif;font-size:13px;color:#5a6068;
}

/* ---- la hoja que se está dando vuelta ----
   Una cadena de tiras, cada una colgada de la anterior. Girando cada una
   un poquito, la suma dibuja un arco: eso es lo que hace que se lea como
   papel y no como un cartón que gira entero. */
.viva{
  position:absolute;top:0;bottom:0;left:50%;width:50%;
  transform-origin:left center;transform-style:preserve-3d;z-index:900;
  pointer-events:none;
}
.tira{
  position:absolute;top:0;bottom:0;
  transform-origin:left center;transform-style:preserve-3d;
}
.ventana{
  position:absolute;top:0;bottom:0;left:0;right:0;
  overflow:hidden;backface-visibility:hidden;
}
.ventana.dorso{transform:rotateY(180deg)}
.ventana .lamina{position:absolute;top:0;bottom:0}
.ventana .sombra{position:absolute;inset:0;background:#241a10;opacity:0;pointer-events:none}
/* la sombra que la hoja levantada tira sobre la página de abajo */
.sombraMesa{
  position:absolute;top:0;bottom:0;width:50%;z-index:300;pointer-events:none;
  background:linear-gradient(90deg,rgba(20,14,8,0) 0%,rgba(20,14,8,.55) 100%);
  opacity:0;
}
.sombraMesa.izq{left:0}
.sombraMesa.der{left:50%;background:linear-gradient(270deg,rgba(20,14,8,0) 0%,rgba(20,14,8,.55) 100%)}

/* ---- lo que se ve debajo de las hojas ----
   También es papel. A la izquierda vive la primera página, que no está en
   ninguna hoja: así el libro arranca abierto y con texto de los dos
   lados, en vez de abrir contra una guarda oscura. A la derecha queda la
   guarda del final, papel en blanco como en cualquier libro. */
.suelo{
  position:absolute;top:0;bottom:0;width:50%;z-index:0;overflow:hidden;
  background:
    radial-gradient(120% 90% at 100% 50%, rgba(0,0,0,.055) 0%, rgba(0,0,0,0) 38%),
    linear-gradient(#fdfcf8,#f7f4ec);
}
.suelo.izq{left:0;box-shadow:inset -15px 0 26px -18px rgba(70,52,30,.75)}
.suelo.der{left:50%;box-shadow:inset 15px 0 26px -18px rgba(70,52,30,.75)}

/* zonas de clic */
.zona{position:absolute;top:0;bottom:0;width:50%;z-index:500;background:none;border:0;
  cursor:grab;touch-action:none}
.libro.agarrando .zona{cursor:grabbing}
.zona.izq{left:0}
.zona.der{left:50%}
.zona:disabled{pointer-events:none}
.zona:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}

.mando{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}
.mando button{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  color:var(--txt);font:inherit;font-size:13.5px;padding:7px 14px;cursor:pointer;
}
.mando button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.mando button:disabled{opacity:.42;cursor:default}
.mando .cuenta{font-size:12.5px;color:var(--muted);min-width:140px;text-align:center}

/* En pantalla angosta no entra un pliego: va una página sola al ancho
   completo y la hoja se corre de costado, que con una sola página se ve
   mejor que media vuelta en el aire. */
@media(max-width:820px){
  .libro{height:clamp(470px,76vh,740px);perspective:none}
  .lomo,.suelo{display:none}
  .zona{cursor:pointer;touch-action:auto}
  .hoja{left:0;width:100%;transition:transform .5s ease,opacity .5s ease}
  .hoja.vuelta{transform:translateX(-12%);opacity:0}
  .cara{border-radius:4px}
  .cara.frente,.cara.dorso{box-shadow:none}
  .cara.dorso{display:none}
  .hueco{padding:30px 26px 40px;font-size:16px;text-align:left}
}
@media(prefers-reduced-motion:reduce){
  .hoja{transition:none}
}

<script id="original" type="text/plain">
<h3>Cómo está armada la mesa</h3>
<p>El banco tiene tres columnas y la señal viaja de derecha a izquierda. A la derecha están las
  <b>fuentes</b>, los dos generadores, con sus salidas sobre el borde izquierdo del frente. En el
  medio está el <b>procesamiento</b>: el multiplicador, el sumador y los dos filtros, cada uno
  con las entradas sobre el borde derecho y la salida sobre el izquierdo, así que la señal los
  atraviesa en el mismo sentido en que cruza la mesa. Y a la izquierda está la <b>medición</b>:
  los dos osciloscopios y el analizador, con las entradas en una franja del borde derecho.</p>
<p>Con esa disposición cada conector mira al equipo que le toca y los cables viajan por los dos
  pasillos que quedan entre columnas. El único que da una vuelta es el que va de un módulo a
  otro, porque tiene que salir por la izquierda y volver a entrar por la derecha, igual que en
  una mesa de verdad. Los cinco botones de arriba arman solos las conexiones de cada ejemplo, y
  después se puede desenchufar y probar otra cosa.</p>

<p>Cada perilla y cada llave se maneja de tres maneras: arrastrando, con la rueda del ratón, o
  con el par de flechitas que tienen al costado. Las flechas mueven el control de a un paso por
  vez y, si se las mantiene apretadas, siguen avanzando solas. Sirven para ajustar sin depender
  del pulso, que es lo que hace falta cuando uno quiere mover la frecuencia de a poquito mirando
  el trazo.</p>

<h3>Los generadores</h3>
<p>La frecuencia sale de dos controles que trabajan juntos: el dial grande da un número entre 0,2
  y 2, y la fila de botones lo multiplica por 1, 10, 100 y así hasta un millón. Poner 1 kHz es
  dejar el dial en 1 y apretar el multiplicador ×1k. Los generadores analógicos siempre se
  manejaron de esa manera, y por eso tienen ese dial enorme con la escala impresa alrededor.</p>
<p>Los dos son el mismo modelo. En los ejemplos al <b>1</b> lo usamos de moduladora, que es la
  señal que lleva la información, y al <b>2</b> de portadora, la señal rápida que la transporta.</p>

<h3>Los osciloscopios</h3>
<p>La pantalla está dividida en 10 divisiones a lo ancho y 8 a lo alto. Ese enrejado es toda la
  regla que hay: el instrumento no dice cuánto mide nada, lo dice la llave. Si el
  <b>VOLTS/DIV</b> está en 2 V y la onda ocupa 3 divisiones de alto, la señal tiene 6 volts de
  pico a pico. Si el <b>TIEMPO/DIV</b> está en 0,2 ms y un ciclo entra en 5 divisiones, el período
  es 1 ms y la frecuencia es su inversa, 1 kHz.</p>
<p>Hay dos osciloscopios y cada uno tiene dos canales, así que se pueden mirar cuatro señales a
  la vez. Es justo lo que hace falta para poner una al lado de la otra la doble banda lateral, la
  AM y las dos bandas laterales únicas. El canal 1 dibuja en verde y el canal 2 en amarillo, con
  un puntito del mismo color al lado de cada rótulo, para no confundirse cuando los dos trazos se
  cruzan.</p>
<p>La llave de <b>VOLTS/DIV</b> no sigue la secuencia 1-2-5 de los equipos de banco sino la
  1-2-3-5-7. Los escalones intermedios sirven: una AM de 15 volts de pico a pico se sale de la
  pantalla en 2 V/div y queda chica en 5, mientras que en 3 V/div ocupa cinco divisiones justas.</p>
<p>El <b>disparo</b> es lo que deja la imagen quieta: espera a que la señal pase por un nivel de
  tensión y recién ahí larga el barrido, así todos los barridos arrancan en el mismo punto de la
  onda. En <b>AUTO</b>, si el nivel quedó fuera de la señal el equipo barre igual y la imagen
  corre; en <b>NORM</b> no barre y la pantalla queda negra. Cuando conviven dos frecuencias muy
  distintas conviene disparar con la más lenta, y por eso en los ejemplos la moduladora va a un
  canal y el disparo toma de ahí.</p>

<h3>El multiplicador y la doble banda lateral</h3>
<p>El multiplicador entrega el producto de sus dos entradas dividido por diez. Esa división no es
  un capricho: los integrados multiplicadores reales traen esa constante para que dos señales de
  diez volts no den cien, que no entrarían en la fuente.</p>
<div class="form">W = X · Y / 10 V
  <span>Con las dos entradas en volts, la salida también queda en volts.</span></div>
<p>Con la moduladora en X y la portadora en Y, el producto de dos cosenos da la identidad de
  siempre: dos cosenos de frecuencias nuevas, la suma y la resta de las originales.</p>
<div class="form">cos(ω<sub>m</sub>t) · cos(ω<sub>c</sub>t) = ½ cos(ω<sub>c</sub>−ω<sub>m</sub>)t + ½ cos(ω<sub>c</sub>+ω<sub>m</sub>)t
  <span>Las dos bandas laterales. La portadora sola no aparece por ningún lado.</span></div>
<p>Eso es una <b>doble banda lateral con portadora suprimida</b>. En el osciloscopio se reconoce
  porque la envolvente toca el cero entre lomo y lomo, y en cada uno de esos cruces la fase de la
  portadora se da vuelta: el dibujo parece rebotar contra el eje en vez de apoyarse. En el
  analizador se reconoce porque hay dos rayas y en el medio, donde debería estar la portadora,
  no hay nada.</p>

<h3>El sumador y la AM</h3>
<p>Una AM común es una doble banda lateral a la que se le devuelve la portadora, y eso es
  exactamente lo que hace el sumador.</p>
<div class="form">V<sub>c</sub>·cos(ω<sub>c</sub>t) + (V<sub>m</sub>V<sub>c</sub>/10)·cos(ω<sub>m</sub>t)·cos(ω<sub>c</sub>t)
  = V<sub>c</sub>·cos(ω<sub>c</sub>t) · [ 1 + (V<sub>m</sub>/10)·cos(ω<sub>m</sub>t) ]
  <span>El corchete es la envolvente, y lo que multiplica al coseno de adentro es el índice de
    modulación.</span></div>
<p>El <b>índice de modulación</b> es entonces la amplitud de pico de la moduladora dividida por
  los 10 V de la constante del multiplicador. Con la moduladora en 10 Vpp su pico es 5 V y el
  índice da 0,5, un 50 %. Subiéndola al máximo de 20 Vpp el índice llega a 1, la envolvente toca
  el cero y la modulación es del 100 %.</p>
<p>En el analizador la diferencia salta a la vista: aparece una tercera raya en el medio, la
  portadora, más alta que las dos laterales. Y el ancho de banda no cambia: sigue siendo el doble
  de la frecuencia moduladora, porque las bandas laterales están donde estaban.</p>

<h3>Los filtros y la banda lateral única</h3>
<p>Si la información va completa en cada banda lateral, mandar las dos es gastar el doble de
  ancho de banda para decir lo mismo. La <b>banda lateral única</b> deja pasar una y tira la otra.
  El método más viejo para lograrlo es el que está armado acá: se hace la doble banda y se le
  pone un filtro que corte justo en la frecuencia de la portadora.</p>
<p>El <b>pasa-altos</b> deja la de arriba y da la banda lateral superior; el <b>pasa-bajos</b>
  deja la de abajo y da la inferior. Los dos filtros son Butterworth, que es la respuesta plana
  en la banda de paso que se estudia primero, y tienen la frecuencia de corte y la cantidad de
  polos a mano.</p>
<p>Acá aparece el problema de verdad de este método. Las dos bandas laterales están separadas
  por el doble de la frecuencia moduladora, y para tirar una sin tocar la otra el filtro tiene que
  caer muchísimo en ese tramo. Con la moduladora en 1 kHz y la portadora en 20 kHz están a 19 y
  21 kHz, apenas un 10 % de diferencia: no hay filtro Butterworth razonable que las separe. Por
  eso los ejemplos de banda lateral única usan una moduladora bastante más alta, de 8 kHz sobre
  una portadora de 32 kHz, donde las bandas quedan en 24 y 40 kHz y un filtro de 16 polos ya
  rechaza la que sobra unos 30 dB.</p>
<p>En un equipo de radio de verdad esto se resuelve con un <b>filtro de cuarzo</b> o mecánico,
  trabajando en una frecuencia intermedia alta, donde el salto entre una banda y la otra es de
  unos cientos de hertz sobre varios megahertz. Ninguna red de resistores y capacitores llega a
  eso; hace falta la selectividad de un cristal. Subiendo los polos del filtro y mirando el
  analizador se ve exactamente cuánto mejora y cuánto falta.</p>
<p>Y hay algo que conviene mirar en el osciloscopio: la banda lateral única de un tono solo
  <b>es una senoidal común</b>, de amplitud constante y de frecuencia igual a la portadora más o
  menos la moduladora. Toda la información quedó en la frecuencia. Por eso una BLU no se puede
  demodular con un detector de envolvente y hace falta reponer la portadora en el receptor.</p>

<h3>El analizador de espectro</h3>
<p>El osciloscopio dibuja la señal contra el tiempo; el analizador la dibuja contra la
  frecuencia. Cada componente senoidal aparece como una raya parada en su frecuencia, y la altura
  dice su amplitud. Es la misma señal vista desde el otro lado.</p>
<p>Los controles son los de cualquier analizador. La <b>frecuencia central</b> y el
  <b>span por división</b> eligen qué pedazo del espectro se mira. La <b>referencia</b> fija qué
  nivel corresponde al borde de arriba de la pantalla, y de ahí para abajo van 10 dB por
  división. El <b>marcador</b> es un cursor vertical que informa la frecuencia y el nivel donde
  se lo pare.</p>
<p>El control que más enseña es el <b>ancho de banda de resolución</b>. Un analizador no ve rayas
  infinitamente finas: cada componente se dibuja con el ancho del filtro que usa para medir. Si
  ese filtro es más ancho que la separación entre dos componentes, las dos se ven como una sola
  loma. Bajándolo aparecen separadas. Con la portadora en 20 kHz y la moduladora en 1 kHz hay que
  bajarlo por debajo del kilohertz para llegar a contar las tres rayas de la AM.</p>
<p>Con el marcador puesto en la raya de más a la izquierda y después en la de más a la derecha se
  lee el <b>ancho de banda ocupado</b>. En la doble banda y en la AM da lo mismo, el doble de la
  moduladora; en la banda lateral única da la mitad. Ése es todo el negocio de la BLU.</p>

<h3>Los modos de la pantalla del osciloscopio</h3>
<ul>
  <li><b>CH 1</b> y <b>CH 2</b> muestran un solo canal.</li>
  <li><b>DUAL</b> muestra los dos, cada uno con su sensibilidad y su posición.</li>
  <li><b>SUMA</b> dibuja la suma de los dos canales, que es lo que hace el amplificador vertical
    cuando se lo deja sumar. No es lo mismo que el módulo sumador: acá la suma es del dibujo y no
    se puede sacar por ningún conector.</li>
  <li><b>X-Y</b> apaga la base de tiempo y usa el canal 1 para el eje horizontal y el 2 para el
    vertical. Con dos senoidales aparecen las figuras de Lissajous; con una AM en un canal y su
    moduladora en el otro aparece el trapecio de modulación, que es la manera clásica de medir el
    índice sin contar divisiones.</li>
</ul>

<h3>Dos detalles del banco</h3>
<p>Las salidas aceptan varios cables y las entradas uno solo. Eso hace falta porque la portadora
  tiene que ir a dos lugares a la vez para armar la AM. En el laboratorio de verdad se resuelve
  con una <b>T de BNC</b>, y hay que tener presente que al repartir una salida entre dos entradas
  la carga cambia y la amplitud puede caer.</p>
<p>Los dos módulos que hacen cuentas, el multiplicador y el sumador, recortan la salida en
  ±12 V, que son los rieles de su fuente, y encienden un piloto cuando eso pasa. Es el mismo
  límite que tiene cualquier circuito con amplificadores operacionales alimentado a esa tensión.</p>

<p style="margin-top:22px;color:var(--soft);font-size:13px">Los frentes están inspirados en los
  equipos analógicos de banco que se usaron durante décadas en las escuelas técnicas. No
  reproducen ningún modelo en particular: son frentes genéricos armados con la disposición de
  controles que casi todos comparten.</p>
</script>

<script>
(function(){
"use strict";

var libro   = document.getElementById("libro");
var hojas   = document.getElementById("hojas");
var fuente  = document.getElementById("fuente");
var cuenta  = document.getElementById("cuenta");
var btAnt   = document.getElementById("btAnt");
var btSig   = document.getElementById("btSig");
var zonaIzq = document.getElementById("zonaIzq");
var zonaDer = document.getElementById("zonaDer");
var sombraIzq = document.getElementById("sombraIzq");
var sueloIzq  = document.getElementById("sueloIzq");
var sombraDer = document.getElementById("sombraDer");

var TIRAS  = 16;      /* en cuántas franjas se parte la hoja que gira */
var CURVA  = 62;      /* cuánto se pliega el papel, en grados */
var CIERRE = 1.7;     /* cuánto se cierra el pliegue hacia el borde de afuera */
var DURA   = 1050;    /* lo que tarda una vuelta */

var PAGINAS = [];
var HOJAS = [];
var vueltas = 0;
var modoSola = false;
var animando = false;

function unaSola(){ return window.matchMedia("(max-width:820px)").matches; }

/* ── El texto de origen ────────────────────────────────────────────
   Viene en un <script type="text/plain"> para que el navegador no lo
   dibuje antes de tiempo. Acá se le pone el título y se numeran las
   secciones, como haría LaTeX. */
function prepararFuente(){
  fuente.innerHTML = document.getElementById("original").textContent;
  var portada = document.createElement("div");
  portada.className = "titulo";
  portada.innerHTML = '<h2>Cómo se usa el banco</h2>' +
    '<div class="filete"></div>' +
    '<p>Simulador de instrumental · catto.ar</p>';
  fuente.insertBefore(portada, fuente.firstChild);

  var n = 0;
  Array.prototype.forEach.call(fuente.querySelectorAll("h3"), function(h){
    n++;
    var num = document.createElement("span");
    num.className = "num";
    num.textContent = n + ".";
    h.insertBefore(num, h.firstChild);
  });
}

/* ── Repartir el texto en páginas ──────────────────────────
   Se arma una página de prueba con la medida exacta de la real y se le
   van metiendo bloques hasta que rebalsa. Los párrafos se parten por la
   palabra justa, como en cualquier libro: cortar por bloques enteros
   dejaba media página en blanco cada vez que venía un subtítulo. */
function nodosTexto(el){
  var out = [];
  (function rec(n){
    var c = n.firstChild;
    while(c){
      if(c.nodeType === 3) out.push(c);
      else if(c.nodeType === 1) rec(c);
      c = c.nextSibling;
    }
  })(el);
  return out;
}
function palabras(s){
  var a = s.split(/\s+/), r = [], i;
  for(i = 0; i < a.length; i++) if(a[i] !== "") r.push(a[i]);
  return r;
}
function contarPalabras(el){
  var t = nodosTexto(el), n = 0, i;
  for(i = 0; i < t.length; i++) n += palabras(t[i].data).length;
  return n;
}
/* Deja en el párrafo sólo las palabras del tramo pedido, respetando las
   negritas: se recorta cada nodo de texto por separado y se sacan los
   que quedaron vacíos. */
function recortar(el, desde, hasta){
  var t = nodosTexto(el), i, j, k = 0;
  for(i = 0; i < t.length; i++){
    var ws = palabras(t[i].data), quedan = [];
    for(j = 0; j < ws.length; j++){
      if(k >= desde && k < hasta) quedan.push(ws[j]);
      k++;
    }
    if(!quedan.length){ t[i].data = ""; continue; }
    var pre  = /^\s/.test(t[i].data) ? " " : "";
    var post = /\s$/.test(t[i].data) ? " " : "";
    t[i].data = pre + quedan.join(" ") + post;
  }
  var dentro = el.querySelectorAll("*");
  for(i = dentro.length - 1; i >= 0; i--)
    if(!dentro[i].textContent.trim() && dentro[i].parentNode)
      dentro[i].parentNode.removeChild(dentro[i]);
  return el;
}
/* cuántas palabras del párrafo entran todavía en lo que queda de página */
function cuantasEntran(parrafo, total, hueco, alto){
  var lo = 1, hi = total - 1, mejor = 0;
  while(lo <= hi){
    var mid = (lo + hi) >> 1;
    var prueba = parrafo.cloneNode(true);
    recortar(prueba, 0, mid);
    hueco.appendChild(prueba);
    var entra = hueco.scrollHeight <= alto;
    hueco.removeChild(prueba);
    if(entra){ mejor = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return mejor;
}

function repartir(){
  var molde = document.createElement("div");
  molde.className = "hoja";
  molde.style.visibility = "hidden";
  molde.innerHTML = '<div class="cara frente"><div class="hueco"></div></div>';
  hojas.appendChild(molde);
  var hueco = molde.querySelector(".hueco");
  var alto = hueco.clientHeight;

  var paginas = [], actual = [];
  function cerrar(){
    if(!actual.length) return;
    paginas.push(actual);
    actual = [];
    hueco.innerHTML = "";
  }

  Array.prototype.slice.call(fuente.children).forEach(function(b){
    var pendiente = b.cloneNode(true), vueltas = 0;
    while(pendiente && vueltas++ < 40){
      hueco.appendChild(pendiente);
      if(hueco.scrollHeight <= alto){ actual.push(pendiente); pendiente = null; break; }
      hueco.removeChild(pendiente);

      if(pendiente.tagName === "P"){
        var total = contarPalabras(pendiente);
        var k = cuantasEntran(pendiente, total, hueco, alto);
        /* no vale la pena partir por tres palabras: queda una viuda fea */
        if(k >= 6 && total - k >= 6){
          var cabeza = pendiente.cloneNode(true); recortar(cabeza, 0, k);
          var cola   = pendiente.cloneNode(true); recortar(cola, k, total);
          cola.className = (cola.className ? cola.className + " " : "") + "sigue";
          hueco.appendChild(cabeza);
          actual.push(cabeza);
          cerrar();
          pendiente = cola;
          continue;
        }
      }
      if(actual.length){ cerrar(); continue; }   /* que lo intente en una página limpia */
      hueco.appendChild(pendiente);              /* no entra ni sola: se deja igual */
      actual.push(pendiente);
      pendiente = null;
    }
  });
  cerrar();

  /* un subtítulo solo al pie queda huérfano: se va con su texto */
  for(var i = 0; i < paginas.length - 1; i++){
    var ult = paginas[i][paginas[i].length - 1];
    if(ult && ult.tagName === "H3" && paginas[i].length > 1){
      paginas[i].pop();
      paginas[i + 1].unshift(ult);
    }
  }

  hojas.removeChild(molde);
  PAGINAS = paginas;
}

function huecoDe(indice){
  var h = document.createElement("div");
  h.className = "hueco";
  h.lang = "es";
  if(PAGINAS[indice]) PAGINAS[indice].forEach(function(n){ h.appendChild(n.cloneNode(true)); });
  return h;
}

function armarCara(clase, indice){
  var cara = document.createElement("div");
  cara.className = "cara " + clase;
  if(!PAGINAS[indice]) return cara;
  cara.appendChild(huecoDe(indice));
  var folio = document.createElement("div");
  folio.className = "folio";
  folio.textContent = indice + 1;
  cara.appendChild(folio);
  return cara;
}

function armar(){
  quitarAsomoYa();
  hojas.innerHTML = "";
  HOJAS = [];
  modoSola = unaSola();
  /* Con el pliego de dos páginas, cada hoja lleva dos caras. Con una sola
     página a la vista no hay dorso posible, así que va una hoja por
     página: de la otra manera las pares no se verían nunca. */
  /* La primera página no está en ninguna hoja: queda fija a la izquierda
     y el libro abre mostrando la 1 y la 2. Las hojas se reparten de la 2
     en adelante, cada una con su frente y su dorso. */
  var n = modoSola ? PAGINAS.length : Math.ceil((PAGINAS.length - 1) / 2), k;
  for(k = 0; k < n; k++){
    var hoja = document.createElement("div");
    hoja.className = "hoja";
    hoja.appendChild(armarCara("frente", modoSola ? k : k * 2 + 1));
    if(!modoSola) hoja.appendChild(armarCara("dorso", k * 2 + 2));
    hojas.appendChild(hoja);
    HOJAS.push(hoja);
  }

  sueloIzq.innerHTML = "";
  if(!modoSola && PAGINAS.length){
    sueloIzq.appendChild(huecoDe(0));
    var folio = document.createElement("div");
    folio.className = "folio";
    folio.textContent = "1";
    sueloIzq.appendChild(folio);
  }

  vueltas = Math.min(vueltas, topeVueltas());
  ordenar();
  pintarMando();
}

/* La hoja de más adelante queda arriba de la pila derecha, y al revés
   del lado izquierdo, que es como se apilan en un libro. */
function ordenar(){
  var n = HOJAS.length, i;
  for(i = 0; i < n; i++){
    if(i < vueltas){ HOJAS[i].classList.add("vuelta"); HOJAS[i].style.zIndex = i + 1; }
    else           { HOJAS[i].classList.remove("vuelta"); HOJAS[i].style.zIndex = n - i; }
  }
}

/* Hasta dónde se puede pasar. Si el dorso de la última hoja no tiene
   página —pasa cuando el texto termina en cara impar— esa vuelta no
   lleva a ninguna parte: dejaría una hoja en blanco a la izquierda. */
function topeVueltas(){
  var n = HOJAS.length;
  if(modoSola) return n - 1;
  return (2 * n <= PAGINAS.length - 1) ? n : n - 1;
}

function pintarMando(){
  var total = PAGINAS.length, texto;
  if(modoSola){
    texto = "Página " + Math.min(vueltas + 1, total) + " de " + total;
  }else{
    var izq = vueltas * 2 + 1, der = izq + 1;   /* folios, no índices */
    if(der <= total) texto = "Páginas " + izq + " y " + der + " de " + total;
    else texto = "Página " + Math.min(izq, total) + " de " + total;
  }
  cuenta.textContent = texto;
  var hayAnt = vueltas > 0, haySig = vueltas < topeVueltas();
  btAnt.disabled = zonaIzq.disabled = !hayAnt;
  btSig.disabled = zonaDer.disabled = !haySig;
}

/* ── La hoja en tiras ──────────────────────────────────────────────
   Cada tira cuelga de la anterior y muestra su franja del texto por una
   ventana recortada. La del dorso va espejada y con el desplazamiento
   contado desde el otro borde, que es donde cae esa misma franja cuando
   la hoja queda del lado izquierdo. */
function construirViva(indice, ancho, sentido){
  var viva = document.createElement("div");
  viva.className = "viva";
  var w = ancho / TIRAS;
  var padre = viva, i, tiras = [], sombras = [];

  for(i = 0; i < TIRAS; i++){
    var tira = document.createElement("div");
    tira.className = "tira";
    /* cada franja va un pelo más ancha de lo que le toca: con el pliegue
       cerrado, entre una y otra se abriría una costura de un píxel */
    tira.style.width = (w + 0.8) + "px";
    tira.style.left = (i === 0 ? 0 : w) + "px";

    tira.appendChild(ventana("frente", indice * 2,     -i * w, ancho, sombras));
    tira.appendChild(ventana("dorso",  indice * 2 + 1, -(TIRAS - 1 - i) * w, ancho, sombras));

    padre.appendChild(tira);
    padre = tira;
    tiras.push(tira);
  }

  /* Cuánto del pliegue total le toca a cada franja, y cuánto lleva
     doblado el papel al llegar a ella. Lo segundo es para la sombra: se
     oscurece lo que ya se dobló, no la franja por estar más afuera. */
  var pesos = [], suma = 0;
  for(i = 0; i < TIRAS; i++){
    var t = (i + 1) / TIRAS;
    var w = Math.pow(t, CIERRE);
    pesos.push(w); suma += w;
  }
  var reparto = [], acumulado = [], corrido = 0;
  for(i = 0; i < TIRAS; i++){
    reparto.push(pesos[i] / suma);
    corrido += reparto[i];
    acumulado.push(corrido);
  }
  return {nodo:viva, tiras:tiras, sombras:sombras, reparto:reparto, acumulado:acumulado,
          sentido:sentido};
}

function ventana(clase, pagina, dx, ancho, sombras){
  var v = document.createElement("div");
  v.className = "ventana " + clase;
  var lamina = document.createElement("div");
  lamina.className = "lamina cara";
  lamina.style.width = ancho + "px";
  lamina.style.left = dx + "px";
  if(PAGINAS[pagina]){
    lamina.appendChild(huecoDe(pagina));
    var folio = document.createElement("div");
    folio.className = "folio";
    folio.textContent = pagina + 1;
    lamina.appendChild(folio);
  }
  var sombra = document.createElement("div");
  sombra.className = "sombra";
  v.appendChild(lamina);
  v.appendChild(sombra);
  sombras.push(sombra);
  return v;
}

/* arranca despacio, toma velocidad y se apoya al final */
function suave(t){
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}
function entre(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* El navegador no da cuadros de animación mientras la pestaña está en
   segundo plano. Con el reloj común de reserva, una vuelta empezada no
   queda colgada si alguien se va a otra pestaña en el medio. */
function proximoCuadro(fn){
  if(document.hidden) setTimeout(fn, 16);
  else requestAnimationFrame(fn);
}

/* ── Dónde queda la hoja para un grado de vuelta ───────────────────
   r va de 0, la hoja quieta a la derecha, a 1, la hoja apoyada a la
   izquierda. Lo usan igual la vuelta automática y el arrastre con el
   ratón: el arrastre le pasa la posición del cursor y la animación la
   va calculando sola. `mano` dice a qué altura se agarró la hoja, de
   −1 arriba a +1 abajo, y de eso salen la inclinación y cuánto se comba
   el papel: agarrada de una punta se dobla más que del medio. */
function pintarVuelta(viva, r, mano){
  var i;
  var giro = -180 * r;
  var comba = Math.sin(Math.PI * Math.pow(r, 0.72));
  /* El pliegue va con el signo del sentido de marcha. La hoja arrastra
     su borde suelto: yendo hacia adelante el borde suelto es el derecho
     y el papel se comba hacia un lado; volviendo, el borde suelto pasa a
     ser el izquierdo y el pliegue se da vuelta, igual que en un libro de
     papel. Antes iba siempre para el mismo lado y el retroceso quedaba
     al revés de lo que hace la mano. */
  var arco = viva.sentido * CURVA * (0.72 + 0.28 * Math.abs(mano)) * comba;

  /* Y no se reparte parejo: junto al lomo el papel queda casi plano,
     porque ahí lo sujeta la encuadernación, y se va cerrando hacia el
     borde suelto, que es donde una hoja de verdad se enrosca. La hoja no
     se ladea: girarla entera la despegaba del libro. */
  viva.tiras[0].style.transform = "rotateY(" + (giro + arco * viva.reparto[0]).toFixed(2) + "deg)";
  for(i = 1; i < TIRAS; i++)
    viva.tiras[i].style.transform = "rotateY(" + (arco * viva.reparto[i]).toFixed(3) + "deg)";

  /* la franja de afuera se oscurece más: es la parte que se aleja de la
     luz al combarse */
  var base = 0.56 * comba;
  for(i = 0; i < TIRAS; i++){
    var f = base * (0.14 + 0.86 * viva.acumulado[i]);
    viva.sombras[i * 2].style.opacity = f;
    viva.sombras[i * 2 + 1].style.opacity = f * 0.75;
  }

  /* y la sombra que la hoja levantada tira sobre la página de abajo */
  var s = 0.85 * comba;
  sombraDer.style.opacity = r < 0.5 ? s : 0;
  sombraIzq.style.opacity = r >= 0.5 ? s : 0;
}

function limpiarSombras(){
  sombraIzq.style.opacity = 0;
  sombraDer.style.opacity = 0;
}

function animarHasta(viva, desde, hasta, mano, ms, listo){
  var t0 = null;
  function cuadro(){
    var ahora = (window.performance ? performance.now() : Date.now());
    if(t0 === null) t0 = ahora;
    var p = ms <= 0 ? 1 : Math.min(1, (ahora - t0) / ms);
    pintarVuelta(viva, desde + (hasta - desde) * suave(p), mano);
    if(p < 1) proximoCuadro(cuadro);
    else{ limpiarSombras(); listo(); }
  }
  proximoCuadro(cuadro);
}

/* ── Pasar una hoja de un saque ────────────────────────────────────  */
function pasar(d){
  if(animando || arrastre) return;
  var n = HOJAS.length;
  if(d > 0 && vueltas >= topeVueltas()) return;
  if(d < 0 && vueltas <= 0) return;
  animando = true;
  var i = d > 0 ? vueltas : vueltas - 1;
  var hoja = HOJAS[i];

  if(modoSola){
    hoja.style.zIndex = n + 2;
    vueltas += d;
    if(d > 0) hoja.classList.add("vuelta"); else hoja.classList.remove("vuelta");
    pintarMando();
    setTimeout(function(){ animando = false; ordenar(); }, 540);
    return;
  }

  var viva = construirViva(i, hoja.getBoundingClientRect().width, d > 0 ? 1 : -1);
  libro.appendChild(viva.nodo);
  hoja.style.visibility = "hidden";
  animarHasta(viva, d > 0 ? 0 : 1, d > 0 ? 1 : 0, 0, DURA, function(){
    libro.removeChild(viva.nodo);
    vueltas += d;
    ordenar();
    hoja.style.visibility = "";
    pintarMando();
    animando = false;
  });
}

/* ── Pasar la hoja con la mano ─────────────────────────────────────
   Se agarra la hoja donde caiga el cursor y desde ahí sigue al ratón:
   la distancia al lomo, medida en anchos de página, es el grado de
   vuelta. Al soltar, si pasó del medio se completa sola y si no vuelve
   a su lugar, que es lo que hace una hoja de papel. */
var arrastre = null, ultimoSoltar = 0;

function tomarHoja(ev){
  if(modoSola || animando || arrastre) return;
  if(ev.button !== undefined && ev.button !== 0) return;

  var caja = libro.getBoundingClientRect();
  var lomoX = caja.left + caja.width / 2;
  var ancho = caja.width / 2;
  var adelante = ev.clientX >= lomoX;
  if(adelante && vueltas >= topeVueltas()) return;
  if(!adelante && vueltas <= 0) return;

  var i = adelante ? vueltas : vueltas - 1;
  var hoja = HOJAS[i];
  var viva, desde;
  /* Si la esquina ya estaba asomada, se sigue con esa misma hoja: así el
     papel no pega un salto entre el asomo y el arrastre. */
  if(asomo && asomo.adelante === adelante){
    viva = asomo.viva; desde = asomo.r; asomo = null;
  }else{
    quitarAsomoYa();
    viva = construirViva(i, ancho, adelante ? 1 : -1);
    libro.appendChild(viva.nodo);
    hoja.style.visibility = "hidden";
    desde = adelante ? 0 : 1;
  }

  arrastre = {
    viva:viva, hoja:hoja, adelante:adelante, lomoX:lomoX, ancho:ancho,
    x0:ev.clientX, corrido:0,
    mano:entre((ev.clientY - (caja.top + caja.height / 2)) / (caja.height / 2), -1, 1),
    r:desde
  };
  libro.classList.add("agarrando");
  try{ libro.setPointerCapture(ev.pointerId); }catch(e){}
  pintarVuelta(viva, arrastre.r, arrastre.mano);
  ev.preventDefault();
}

function moverHoja(ev){
  if(!arrastre) return;
  arrastre.corrido = Math.max(arrastre.corrido, Math.abs(ev.clientX - arrastre.x0));
  /* +1 en el borde de afuera derecho, 0 en el lomo, −1 en el izquierdo */
  var u = (ev.clientX - arrastre.lomoX) / arrastre.ancho;
  arrastre.r = entre((1 - u) / 2, 0, 1);
  pintarVuelta(arrastre.viva, arrastre.r, arrastre.mano);
}

function soltarHoja(){
  if(!arrastre) return;
  var a = arrastre;
  arrastre = null;
  ultimoSoltar = Date.now();
  libro.classList.remove("agarrando");

  /* un toque sin arrastrar pasa la hoja entera, como un clic de toda la vida */
  var apenasUnClic = a.corrido < 6;
  var pasa = apenasUnClic ? true : (a.adelante ? a.r >= 0.42 : a.r <= 0.58);
  var destino = a.adelante ? (pasa ? 1 : 0) : (pasa ? 0 : 1);
  var falta = Math.abs(destino - a.r);
  var ms = Math.max(240, DURA * falta * 0.95);

  animando = true;
  animarHasta(a.viva, a.r, destino, a.mano, ms, function(){
    libro.removeChild(a.viva.nodo);
    if(pasa){ vueltas += a.adelante ? 1 : -1; ordenar(); pintarMando(); }
    a.hoja.style.visibility = "";
    animando = false;
  });
}

/* ── La esquina que se levanta sola ────────────────────────
   Al acercar el cursor al borde suelto, la hoja se despega un poco y
   queda esperando que tiren de ella. Cuanto más cerca del borde, más se
   levanta; y agarrada por una punta se comba más que por el medio, que
   es lo mismo que hace el arrastre. */
var ZONA_ASOMO = 130;
var asomo = null, retirada = null, cajaLibro = null;

function medirLibro(){ cajaLibro = libro.getBoundingClientRect(); }
window.addEventListener("scroll", function(){ cajaLibro = null; }, true);

function quitarAsomoYa(){
  if(retirada){
    if(retirada.viva.nodo.parentNode) libro.removeChild(retirada.viva.nodo);
    retirada.hoja.style.visibility = "";
    retirada = null;
  }
  if(!asomo) return;
  if(asomo.viva.nodo.parentNode) libro.removeChild(asomo.viva.nodo);
  asomo.hoja.style.visibility = "";
  asomo = null;
}

function bajarAsomo(){
  if(!asomo) return;
  var a = asomo;
  asomo = null;
  retirada = a;
  animarHasta(a.viva, a.r, a.base, a.mano, 260, function(){
    if(retirada !== a) return;          /* ya lo levantó otro */
    if(a.viva.nodo.parentNode) libro.removeChild(a.viva.nodo);
    a.hoja.style.visibility = "";
    retirada = null;
  });
}

function cuidarAsomo(ev){
  if(modoSola || animando || arrastre){ return; }
  if(!cajaLibro) medirLibro();
  var caja = cajaLibro;
  var lomoX = caja.left + caja.width / 2, ancho = caja.width / 2;
  var adelante = ev.clientX >= lomoX;
  var dist = adelante ? (caja.right - ev.clientX) : (ev.clientX - caja.left);
  var hay = adelante ? (vueltas < topeVueltas()) : (vueltas > 0);
  var dentro = ev.clientY >= caja.top && ev.clientY <= caja.bottom;

  if(!hay || !dentro || dist > ZONA_ASOMO || dist < 0){ bajarAsomo(); return; }

  if(!asomo || asomo.adelante !== adelante){
    quitarAsomoYa();
    var i = adelante ? vueltas : vueltas - 1;
    var hoja = HOJAS[i];
    if(!hoja) return;
    var viva = construirViva(i, ancho, adelante ? 1 : -1);
    libro.appendChild(viva.nodo);
    hoja.style.visibility = "hidden";
    asomo = {viva:viva, hoja:hoja, adelante:adelante, base:adelante ? 0 : 1, r:adelante ? 0 : 1, mano:0};
  }
  var cerca = 1 - dist / ZONA_ASOMO;
  var levanta = 0.012 + 0.085 * cerca * cerca;
  asomo.mano = entre((ev.clientY - (caja.top + caja.height / 2)) / (caja.height / 2), -1, 1);
  asomo.r = asomo.adelante ? levanta : 1 - levanta;
  pintarVuelta(asomo.viva, asomo.r, asomo.mano);
}

libro.addEventListener("pointerenter", medirLibro);
libro.addEventListener("pointermove", cuidarAsomo);
libro.addEventListener("pointerleave", bajarAsomo);

libro.addEventListener("pointerdown", tomarHoja);
/* el seguimiento va en la ventana y no en el libro: si el cursor se va
   afuera mientras se arrastra, la hoja lo sigue igual y no queda pegada */
window.addEventListener("pointermove", moverHoja);
window.addEventListener("pointerup", soltarHoja);
window.addEventListener("pointercancel", soltarHoja);
/* El clic que viene detrás de soltar ya está atendido por el arrastre:
   sin esto, la hoja se pasaría dos veces. */
libro.addEventListener("click", function(ev){
  if(Date.now() - ultimoSoltar < 400){ ev.stopPropagation(); ev.preventDefault(); }
}, true);

zonaDer.addEventListener("click", function(){ pasar(1); });
zonaIzq.addEventListener("click", function(){ pasar(-1); });
btSig.addEventListener("click", function(){ pasar(1); });
btAnt.addEventListener("click", function(){ pasar(-1); });
document.addEventListener("keydown", function(ev){
  if(ev.key === "ArrowRight") pasar(1);
  else if(ev.key === "ArrowLeft") pasar(-1);
});

var reloj = null, anchoAntes = 0;
function rehacer(){
  var pagina = modoSola ? vueltas : vueltas * 2;
  repartir();
  vueltas = unaSola() ? pagina : Math.floor(pagina / 2);
  cajaLibro = null;
  armar();
}
window.addEventListener("resize", function(){
  if(window.innerWidth === anchoAntes) return;
  anchoAntes = window.innerWidth;
  clearTimeout(reloj);
  reloj = setTimeout(rehacer, 220);
});

anchoAntes = window.innerWidth;
prepararFuente();
repartir();
armar();

/* La tipografía llega por la red y cambia el alto de los renglones: hay
   que repartir de nuevo cuando termina de cargar. */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(rehacer);

})();
</script>
