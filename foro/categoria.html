<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foro · Catto</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d1117">
<link rel="stylesheet" href="/assets/css/base.css?v=12">
<link rel="stylesheet" href="/assets/css/papel.css?v=8">
<link rel="stylesheet" href="/foro/foro.css?v=2">
<script src="/aula/assets/vendor/supabase.js"></script>
<script src="/aula/assets/config.js"></script>
<script src="/foro/foro.js?v=2"></script>
</head>
<body>
<header class="site">
  <div class="container">
    <a class="brand" href="/"><span class="logo">⚡</span> <span>catto<span class="dom">.ar</span></span></a>
    <nav class="main">
      <a href="/">Inicio</a>
      <a href="/#publicaciones">Publicaciones</a>
      <a href="/foro" class="active">Foro</a>
    </nav>
  </div>
</header>
<div class="foro-barra"><div class="in" id="foroBarra"></div></div>

<main class="foro">
  <p class="f-pagina"><a href="/foro">← Foro</a></p>
  <h1 id="titulo">Categoría</h1>
  <p class="f-fila" style="margin:6px 0 16px"><a class="f-btn pri" id="nueva" href="/foro/nueva">Nueva consulta en esta categoría</a></p>
  <div id="lista"><p class="f-vacio">Cargando…</p></div>
  <p style="margin-top:14px"><button class="f-btn" id="mas" hidden>Ver más</button></p>
</main>

<script>
(function () {
  var F = window.Foro, c = F.q('c') || '', PASO = 30, desde = 0, todos = [];
  F.$('nueva').href = '/foro/nueva?c=' + encodeURIComponent(c);
  F.sb.from('foro_categoria').select('*').eq('slug', c).maybeSingle().then(function (r) {
    if (r.error) { F.$('lista').innerHTML = '<p class="f-err">' + F.esc(F.error(r.error)) + '</p>'; return; }
    if (!r.data) { F.$('titulo').textContent = 'Categoría inexistente'; F.$('lista').innerHTML = ''; return; }
    var nom = r.data.grupo === 'General' ? r.data.nombre : r.data.grupo + ' · ' + r.data.nombre;
    F.$('titulo').textContent = nom; document.title = nom + ' · Foro · Catto';
    cargar();
  });
  function cargar() {
    F.sb.from('foro_tema').select(F.SEL_TEMA).eq('categoria', c).eq('estado', 'publicado')
      .order('actividad', { ascending: false }).range(desde, desde + PASO - 1).then(function (t) {
        if (t.error) { F.$('lista').innerHTML = '<p class="f-err">' + F.esc(F.error(t.error)) + '</p>'; return; }
        todos = todos.concat(t.data); desde += t.data.length;
        F.listaTemas(F.$('lista'), todos);
        F.$('mas').hidden = t.data.length < PASO;
      });
  }
  F.$('mas').onclick = cargar;
})();
</script>
</body>
</html>
