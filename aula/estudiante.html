<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/aula/">
<title>Aula Catto · Estudiante</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/css/base.css?v=11">
<link rel="stylesheet" href="../assets/css/aula.css?v=7">
<style>
/* La fila de actividad ahora lleva el botón de entregar / re-entregar.
   En pantalla angosta (los estudiantes entran del celular) la fila se parte:
   el título ocupa el primer renglón y fecha, nota, estado y botón el segundo.
   Si no, el botón aplasta el título hasta dejarlo ilegible. */
.act .act-btn{flex:none}
@media(max-width:640px){
  .act{flex-wrap:wrap;gap:10px 12px}
  .act .ai{flex:1 0 100%}
  .act .act-btn{margin-left:auto}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">🎓</span> Aula Catto</div>
    <a class="nav active">📋 Mis actividades</a>
    <a class="nav" onclick="document.querySelector('.profile').scrollIntoView({behavior:'smooth'})">👤 Mi perfil</a>
    <div class="spacer"></div>
    <div class="me">
      <div class="ph" id="meIni">·</div>
      <div><b id="meName">…</b><span id="meCurso">Estudiante</span></div>
    </div>
    <a class="nav" onclick="logout()">↩ Salir</a>
  </aside>

  <main class="main">
    <div class="starfield" aria-hidden="true"
         data-mw data-ax="45" data-ay="-8" data-bx="85" data-by="82" data-core="0.55" data-field="220" data-band="220">
      <div class="mw"></div>
      <div class="mw-core"></div>
    </div>
    <h1 id="hola">Hola 👋</h1>
    <div class="crumb" id="subcrumb">…</div>

    <!-- Perfil -->
    <div class="profile">
      <div class="pic" id="pic">·</div>
      <div class="pinfo">
        <h2 id="pNombre">…</h2>
        <p id="pUser">…</p>
        <div class="inline" style="margin-top:10px">
          <button class="btn sm" style="width:auto" onclick="document.getElementById('fotoInput').click()">📷 Cambiar foto</button>
          <input id="fotoInput" type="file" accept="image/*" style="display:none" onchange="subirFoto(this.files[0])">
          <span id="fotoMsg" style="font-size:12px;color:var(--muted)"></span>
        </div>
      </div>
    </div>

    <!-- Resumen -->
    <div class="stats-row">
      <div class="scard warn"><b id="s-pend">0</b><span>Pendientes</span></div>
      <div class="scard"><b id="s-ent">0</b><span>Entregadas</span></div>
      <div class="scard ok"><b id="s-cal">0</b><span>Calificadas</span></div>
    </div>

    <p class="section-title">Mis actividades</p>
    <div class="act-list" id="actList"><div class="empty">Cargando…</div></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script src="../assets/js/starfield.js?v=1"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
let PERFIL, CURSO=null, ACTS=[], ENTREGAS={};

(async function init(){
  const auth = await requireAuth('estudiante');
  if(!auth) return;
  PERFIL = auth.perfil;
  if(PERFIL.curso_id){
    const { data } = await sb.from('curso').select('nombre').eq('id', PERFIL.curso_id).single();
    CURSO = data?.nombre || null;
  }
  pintarPerfil();
  await cargar();
})();

function pintarPerfil(){
  const nom = `${PERFIL.nombre||''} ${PERFIL.apellido||''}`.trim() || 'Estudiante';
  document.getElementById('hola').textContent = `Hola, ${PERFIL.nombre||''} 👋`;
  document.getElementById('subcrumb').textContent = CURSO ? `Curso: ${CURSO}` : 'Sin curso asignado';
  document.getElementById('meName').textContent = nom;
  document.getElementById('meCurso').textContent = CURSO || 'Estudiante';
  document.getElementById('meIni').textContent = iniciales(PERFIL.nombre, PERFIL.apellido);
  document.getElementById('pNombre').textContent = nom;
  document.getElementById('pUser').innerHTML = `Usuario: <b>${esc(PERFIL.usuario||'')}</b>${CURSO?` · Curso: ${esc(CURSO)}`:''}`;
  pintarFoto();
}
async function pintarFoto(){
  const pic = document.getElementById('pic');
  if(PERFIL.foto_path){
    const url = await signedUrl('fotos-perfil', PERFIL.foto_path, 600);
    if(url){ pic.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`; return; }
  }
  pic.textContent = iniciales(PERFIL.nombre, PERFIL.apellido);
}
/* Achica la foto en el navegador antes de subirla: lleva el lado mayor a 512 px
   y la pasa a JPEG. Una foto de celular baja de ~2-3 MB a ~50 KB, así las
   listas con muchas fotos cargan livianas. Si algo falla, sube la original. */
async function achicarImagen(file, max=512, calidad=0.85){
  try{
    if(!file || !file.type || !file.type.startsWith('image/')) return null;
    let bmp;
    try{ bmp = await createImageBitmap(file, { imageOrientation:'from-image' }); }  // respeta el EXIF (fotos verticales)
    catch(_){ bmp = await createImageBitmap(file); }
    const escala = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * escala));
    const h = Math.max(1, Math.round(bmp.height * escala));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    if(bmp.close) bmp.close();
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', calidad));
    if(!blob || blob.size >= file.size) return null;   // si no achica nada, dejamos la original
    return new File([blob], 'foto.jpg', { type:'image/jpeg' });
  }catch(e){ return null; }
}
function tamLegible(b){
  if(b < 1024) return b+' B';
  if(b < 1048576) return Math.round(b/1024)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}
async function subirFoto(file){
  if(!file) return;
  const msg = document.getElementById('fotoMsg');
  if(!file.type.startsWith('image/')) { msg.textContent='Tiene que ser una imagen.'; return; }
  if(file.size > 12*1024*1024){ msg.textContent='Máximo 12 MB.'; return; }
  msg.style.color='var(--muted)'; msg.textContent='Optimizando…';
  try{
    const chica = await achicarImagen(file);
    const subir = chica || file;
    msg.textContent='Subiendo…';
    const path = chica
      ? `${PERFIL.id}/${Date.now()}_foto.jpg`
      : `${PERFIL.id}/${Date.now()}_${safeName(file.name)}`;
    await subirArchivo('fotos-perfil', path, subir);
    const { error } = await sb.from('perfil').update({ foto_path: path }).eq('id', PERFIL.id);
    if(error) throw error;
    PERFIL.foto_path = path;
    msg.style.color='var(--ok)'; msg.textContent=`✓ Foto actualizada (${tamLegible(subir.size)})`;
    pintarFoto();
  }catch(e){ msg.style.color='var(--hot)'; msg.textContent='Error: '+e.message; }
}

async function cargar(){
  // RLS ya limita las actividades a las materias del curso del estudiante
  const [{ data:acts }, { data:ents }] = await Promise.all([
    sb.from('actividad').select('*, materia(nombre)').order('fecha_limite',{ascending:true,nullsFirst:false}),
    sb.from('entrega').select('*').eq('estudiante_id', PERFIL.id)
  ]);
  ACTS = acts||[];
  ENTREGAS = {}; (ents||[]).forEach(e=> ENTREGAS[e.actividad_id]=e);
  render();
}

function estadoDe(a){
  const e = ENTREGAS[a.id];
  if(!e) return 'pendiente';
  return e.estado === 'calificado' ? 'calificada' : 'entregada';
}
const BADGE = {pendiente:{c:'b-pend',t:'Pendiente'}, entregada:{c:'b-ent',t:'Entregada'}, calificada:{c:'b-cal',t:'Calificada'}};

function render(){
  const box = document.getElementById('actList');
  let p=0,en=0,c=0;
  if(!ACTS.length){
    box.innerHTML = '<div class="empty">Todavía no hay actividades en tus materias. Cuando el profesor publique una, va a aparecer acá.</div>';
  } else {
    box.innerHTML = ACTS.map(a=>{
      const st = estadoDe(a); const b = BADGE[st];
      if(st==='pendiente')p++; else if(st==='entregada')en++; else c++;
      const e = ENTREGAS[a.id];
      const soon = a.fecha_limite && st==='pendiente';
      const cerr = vencida(a.fecha_limite);
      /* Botón directo a la subida: si ya entregó, "Re-entregar" (puede corregir
         mientras la actividad siga abierta); si venció, sólo ver sus archivos. */
      const accion = e
        ? `<button class="btn ghost sm act-btn" onclick="abrirSubida(event,${a.id})">${cerr?'Ver mi entrega':'↻ Re-entregar'}</button>`
        : (cerr ? '' : `<button class="btn sm act-btn" onclick="abrirSubida(event,${a.id})">Entregar</button>`);
      return `<div class="act" onclick="openAct(${a.id})">
        <div class="ai"><h3>${esc(a.titulo)}</h3><div class="am">${esc(a.materia?.nombre||'')}</div></div>
        <div class="due ${soon?'soon':''}">${fechaTxt(a.fecha_limite)}</div>
        ${e?.nota_num!=null ? `<span class="nota">${e.nota_num}</span>` : ''}
        <span class="badge2 ${b.c}">${b.t}</span>
        ${accion}
      </div>`;
    }).join('');
  }
  document.getElementById('s-pend').textContent=p;
  document.getElementById('s-ent').textContent=en;
  document.getElementById('s-cal').textContent=c;
}

/* Abre la actividad directo en la zona de subida (botón de la lista) */
function abrirSubida(ev, id){ if(ev) ev.stopPropagation(); openAct(id, true); }

async function openAct(id, foco){
  const a = ACTS.find(x=>x.id===id); if(!a) return;
  const e = ENTREGAS[a.id];
  const st = estadoDe(a);
  const cerrada = vencida(a.fecha_limite);

  // Material de la consigna
  let mat = '';
  const adj = Array.isArray(a.adjuntos) ? a.adjuntos : [];
  if(adj.length){
    mat = `<div class="inline" style="margin-top:4px">
      ${adj.map(ad=>`<a onclick='verArchivo("consignas","${esc(ad.path)}")'>📎 ${esc(ad.nombre||'Adjunto')}</a>`).join('')}
    </div>`;
  }
  const vids = (Array.isArray(a.videos)&&a.videos.length)?a.videos:(a.video_url?[a.video_url]:[]);
  const video = vids.map(v=>{
    const yi = ytId(v);
    return yi
      ? `<div style="position:relative;padding-bottom:56.25%;height:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-top:8px"><iframe src="https://www.youtube.com/embed/${yi}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
      : `<a href="${esc(v)}" target="_blank" rel="noopener" style="display:block;margin-top:8px">▶ Ver video</a>`;
  }).join('');

  // Devolución (se muestra aunque haya re-entregado después de la corrección)
  let grade = '';
  if(e && (e.nota_num!=null || e.nota_concepto || e.comentario_profesor)){
    grade = `<div class="grade-box"><label>Devolución del profesor</label>
      <div class="inline">${e.nota_num!=null?`<span class="gn">${e.nota_num}</span>`:''}${e.nota_concepto?`<span class="badge2 b-cal">${esc(e.nota_concepto)}</span>`:''}</div>
      ${e.comentario_profesor?`<p style="margin:10px 0 0;font-size:13.5px;color:var(--txt)">${esc(e.comentario_profesor)}</p>`:''}
      ${e.estado!=='calificado'?`<div style="font-size:11.5px;color:var(--soft);margin-top:8px">Corresponde a tu entrega anterior: el profesor va a revisar la nueva.</div>`:''}</div>`;
  }

  // Se puede corregir la entrega mientras la actividad no haya vencido,
  // incluso si ya fue calificada (el profesor la vuelve a corregir).
  const puedeEntregar = !cerrada;

  // Tu entrega: los archivos ya subidos, con opción de verlos y de quitarlos
  let entrega = '';
  const mis = archivosDe(e);
  if(e){
    entrega = `<div><label>Tus archivos entregados${mis.length?` (${mis.length})`:''}</label><div class="consigna">
      ${mis.length ? mis.map((f,i)=>`
        <div class="inline" style="justify-content:space-between;flex-wrap:nowrap;${i?'margin-top:8px;padding-top:8px;border-top:1px solid var(--line)':''}">
          <a onclick='verArchivo("entregas","${esc(f.path)}")' style="cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📄 ${esc(nombreArchivo(f))}</a>
          ${puedeEntregar?`<button class="btn ghost sm" style="flex:none;padding:4px 9px;font-size:12px" title="Quitar este archivo de tu entrega" onclick="quitarArchivo(${a.id},${i})">✕ Quitar</button>`:''}
        </div>`).join('') : '<span style="color:var(--soft)">(sin archivos)</span>'}
      ${e.entregado_en?`<div style="color:var(--soft);font-size:12px;margin-top:${mis.length?10:4}px">Última entrega: ${new Date(e.entregado_en).toLocaleString('es-AR')}</div>`:''}
      ${e.comentario_estudiante?`<div style="margin-top:8px;color:var(--muted)">“${esc(e.comentario_estudiante)}”</div>`:''}
    </div></div>`;
  }

  // Formulario de subida (entregar / re-entregar / agregar archivos)
  let form = '';
  if(puedeEntregar){
    form = `<div id="zonaSubida">
      <label>${e?'Re-entregar o agregar archivos':'Subir tu trabajo'}</label>
      ${st==='calificada'?`<div class="note" style="margin-bottom:10px">Esta actividad ya está calificada. Si volvés a entregar, el profesor la va a tener que corregir de nuevo.</div>`:''}
      <div class="drop" onclick="document.getElementById('subInput').click()">
        <span class="di">📎</span> <span id="subName">Hacé clic para elegir tus archivos</span><br>
        <span style="font-size:11.5px;color:var(--soft)">Podés elegir varios · PDF · JPG · PNG · DOC — hasta 10 MB c/u</span>
      </div>
      <input id="subInput" type="file" multiple style="display:none" onchange="document.getElementById('subName').textContent=this.files.length?(this.files.length+' archivo(s) seleccionado(s)'):'Hacé clic para elegir tus archivos'">
      ${mis.length?`<div class="inline" style="margin-top:10px">
        <input type="checkbox" id="subReemplazar" style="width:auto;margin:0;flex:none">
        <label for="subReemplazar" style="margin:0;cursor:pointer">Reemplazar lo que ya subí (si no lo marcás, los nuevos se <b>agregan</b> ${mis.length===1?'al que ya subí':'a los '+mis.length+' de arriba'})</label>
      </div>`:''}
      <label style="margin-top:14px">Comentario (opcional)</label>
      <textarea id="subCom" rows="2" placeholder="Algo que quieras aclararle al profe…">${e?esc(e.comentario_estudiante||''):''}</textarea>
      <div id="subMsg" style="font-size:12.5px;margin-top:8px;color:var(--muted)"></div>
    </div>`;
  } else {
    form = `<div class="note">La fecha límite venció${mis.length?': tus archivos quedaron entregados, pero ya no se pueden cambiar':'. Ya no se puede entregar'}. Si necesitás corregir, pedile al profesor que extienda la fecha.</div>`;
  }

  document.getElementById('modal').innerHTML = `
    <div class="mh"><div><h3>${esc(a.titulo)}</h3><div class="mc">${esc(a.materia?.nombre||'')} · ${fechaTxt(a.fecha_limite)}</div></div>
      <button class="x" onclick="closeM()">✕</button></div>
    <div class="mb">
      <div><label>Consigna</label><div class="consigna">${esc(a.consigna||'(sin consigna)')}</div>${mat}</div>
      ${video}
      ${grade}
      ${entrega}
      ${form}
    </div>
    <div class="mf">
      <button class="btn ghost sm" style="width:auto" onclick="closeM()">Cerrar</button>
      ${puedeEntregar?`<button class="btn sm" id="subBtn" style="width:auto" onclick="entregar(${a.id})">${e?'↻ Re-entregar':'Entregar'}</button>`:''}
    </div>`;
  document.getElementById('modalBg').classList.add('open');
  if(foco){ const z = document.getElementById('zonaSubida') || document.getElementById('modal'); z.scrollIntoView({behavior:'smooth', block:'center'}); }
}

/* Archivos de una entrega, normalizados a [{path,nombre}] (soporta las viejas
   de un solo archivo, que guardaban sólo archivo_path). */
function archivosDe(e){
  if(!e) return [];
  if(Array.isArray(e.archivos) && e.archivos.length) return e.archivos.slice();
  return e.archivo_path ? [{ path:e.archivo_path, nombre:'archivo' }] : [];
}
/* Borra del Storage archivos que ya no forman parte de la entrega, para no
   dejar basura en el bucket. Si el proyecto todavía no tiene la política de
   DELETE (aula/db/reentrega.sql), falla en silencio: no rompe nada. */
async function borrarDeStorage(paths){
  if(!paths || !paths.length) return;
  try{ await sb.storage.from('entregas').remove(paths); }catch(_){}
}

async function entregar(actId){
  const e = ENTREGAS[actId];
  const previos = archivosDe(e);
  const reemplazar = !!(document.getElementById('subReemplazar') && document.getElementById('subReemplazar').checked);
  const files = document.getElementById('subInput').files;
  const com  = document.getElementById('subCom').value.trim() || null;
  const msg  = document.getElementById('subMsg');
  if(!files.length && !previos.length){
    msg.style.color='var(--warn)'; msg.textContent='Elegí al menos un archivo.'; return;
  }
  if(!files.length && reemplazar){
    msg.style.color='var(--warn)'; msg.textContent='Elegí los archivos nuevos con los que querés reemplazar tu entrega.'; return;
  }
  const btn = document.getElementById('subBtn'); const rotulo = btn.textContent;
  btn.disabled=true; btn.textContent = files.length ? 'Subiendo…' : 'Guardando…';
  try{
    const nuevos = [];
    for(let i=0;i<files.length;i++){
      const f = files[i];
      if(f.size > 10*1024*1024) throw new Error(`"${f.name}" supera los 10 MB.`);
      const path = `${PERFIL.id}/${actId}_${Date.now()}_${i}_${safeName(f.name)}`;
      await subirArchivo('entregas', path, f);
      nuevos.push({ path, nombre: f.name });
    }
    const archivos = reemplazar ? nuevos : previos.concat(nuevos);
    const fila = {
      actividad_id: actId, estudiante_id: PERFIL.id,
      archivos, archivo_path: archivos.length?archivos[0].path:null,
      comentario_estudiante: com
    };
    // Si cambiaron los archivos vuelve a quedar "entregada" (el profesor la
    // corrige de nuevo). Si sólo se editó el comentario, no se toca el estado.
    if(files.length){ fila.entregado_en = new Date().toISOString(); fila.estado = 'entregado'; }
    const { error } = await sb.from('entrega').upsert(fila, { onConflict: 'actividad_id,estudiante_id' });
    if(error) throw error;
    if(reemplazar) borrarDeStorage(previos.map(f=>f.path));
    closeM(); await cargar();
  }catch(err){
    msg.style.color='var(--hot)'; msg.textContent='Error: '+err.message;
    btn.disabled=false; btn.textContent=rotulo;
  }
}

/* Quita un archivo de la entrega (los demás quedan como están) */
async function quitarArchivo(actId, i){
  const e = ENTREGAS[actId]; if(!e) return;
  const lista = archivosDe(e);
  const f = lista[i]; if(!f) return;
  const nom = nombreArchivo(f);
  const aviso = lista.length===1
    ? `¿Quitar "${nom}"? Vas a quedar sin ningún archivo entregado.`
    : `¿Quitar "${nom}" de tu entrega?`;
  if(!confirm(aviso)) return;
  lista.splice(i,1);
  const { error } = await sb.from('entrega')
    .update({ archivos: lista, archivo_path: lista.length?lista[0].path:null })
    .eq('id', e.id);
  if(error) return alert('No se pudo quitar el archivo: '+error.message);
  borrarDeStorage([f.path]);
  await cargar();
  openAct(actId, true);
}

async function verArchivo(bucket, path){
  const url = await signedUrl(bucket, path, 120);
  if(!url) return alert('No se pudo abrir el archivo.');
  window.open(url, '_blank');
}
function closeM(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeM();});
</script>
</body>
